<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OKEII · Strong Readers Act — Deployment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Every piece of creative in the Strong Readers Act implementation campaign, one placeholder per deliverable, browsable by channel.">
<!-- Unlisted client link: not on the lab index, not in sitemap.xml, and unreleased
     creative lives here. Keep it out of search results too. -->
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23082F7B'/><text x='16' y='23' font-family='Helvetica,Arial' font-size='17' font-weight='700' text-anchor='middle' fill='%23fff'>S</text></svg>">
<link rel="stylesheet" href="app.css?v=2">
</head>
<body>

<a class="skip" href="#main">Skip to the creative</a>

<header class="mast">
  <div class="mast-in">
    <h1><span class="eyebrow">OKEII</span> Strong Readers Act <span class="thin">· Implementation</span></h1>
    <div class="mast-tools">
      <label class="search">
        <span class="vh">Search every channel</span>
        <input type="search" id="q" placeholder="Search all channels…" autocomplete="off" spellcheck="false">
      </label>
      <button class="tool" id="who" title="Who is dropping files">Sign in</button>
      <button class="tool" id="lock" title="Unlock editing">Unlock</button>
    </div>
  </div>
  <nav class="rail" id="rail" aria-label="Channels"></nav>
</header>

<main id="main">
  <div id="sections"></div>
</main>

<!-- The slot inspector. Everything that isn't a title, a spec or a placeholder
     lives in here rather than on the board. -->
<div class="drawer-scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-labelledby="drawer-title" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <div>
      <p class="drawer-crumb" id="drawer-crumb"></p>
      <h2 id="drawer-title"></h2>
    </div>
    <button class="tool" id="drawer-close" aria-label="Close">Close</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="dropveil" id="dropveil" hidden><p>Drop it on the placeholder it belongs to</p></div>

<script src="app.js?v=2"></script>
</body>
</html>
