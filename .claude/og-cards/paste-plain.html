<!doctype html>
<!-- Source for /paste-plain/img/og.png. See vault.html for the render command. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#1a0e05}
body{font-family:Inter,-apple-system,system-ui,sans-serif;position:relative}
.glow{position:absolute;inset:auto -10% -30% -10%;height:80%;
      background:radial-gradient(50% 100% at 72% 100%,rgba(255,210,74,.14),transparent 70%)}
.wrap{position:absolute;inset:0;padding:74px 72px;box-sizing:border-box;
      display:flex;align-items:center;gap:56px}
.left{flex:1 1 auto}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:19px;letter-spacing:5.5px;color:#ffd24a;text-transform:uppercase}
h1{margin:16px 0 0;font-size:84px;line-height:.95;letter-spacing:-2.5px;
   font-weight:800;color:#fdf3ea}
.sub{margin:20px 0 0;font-size:28px;line-height:1.35;color:#c9b39d;max-width:520px}
.url{margin:34px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     font-size:20px;letter-spacing:.5px;color:#8a7460}
.keys{flex:0 0 auto;display:flex;gap:14px;align-items:center}
kbd{display:grid;place-items:center;width:112px;height:112px;border-radius:18px;
    background:#241408;border:1px solid #3c2612;box-shadow:0 16px 40px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,210,74,.14);
    font-family:Inter,system-ui,sans-serif;font-size:48px;font-weight:600;color:#ffd24a}
kbd.big{width:112px;font-size:44px}
.plus{font-size:32px;color:#8a7460}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">Free Mac menu bar app</div>
    <h1>PlainPaste</h1>
    <div class="sub">Paste anything as plain text. No fonts, no colours, no tracking pixels &mdash; just the words.</div>
    <div class="url">lab.philipbaker.us/paste-plain</div>
  </div>
  <div class="keys">
    <kbd>&#8963;</kbd><span class="plus">+</span><kbd>&#8984;</kbd><span class="plus">+</span><kbd class="big">V</kbd>
  </div>
</div>
</body></html>
