<!doctype html>
<!-- Source for /vault/img/og.jpg (render to PNG, then `sips -s format jpeg -s formatOptions 84`). Render with:
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
       --window-size=1200,630 --force-device-scale-factor=1 \
       --screenshot=<out>.png "file://<abs path to this file>"
     (--headless=new writes the file then never exits: background it, wait for the
      file, pkill it by its --user-data-dir.)
     The background is the real game: Alien Maze (Six Flags) as captured in vault/shots/ —
     Philip's pick for this card, Sep 25 2026. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000}
body{font-family:Inter,-apple-system,system-ui,sans-serif;position:relative}
/* the maze at 1.4x, placed so the Six Flags mark sits right of centre */
.maze{position:absolute;left:356px;top:-76px;width:1008px;height:748px;
      background:url(../../vault/shots/alien-maze.jpg) 0 0/100% 100% no-repeat}
.shade{position:absolute;inset:0;
       background:linear-gradient(90deg,#000 0%,#000 28%,rgba(0,0,0,.84) 43%,rgba(0,0,0,.3) 60%,rgba(0,0,0,0) 72%),
                  linear-gradient(0deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,0) 26%)}
.wrap{position:absolute;inset:0;padding:66px 72px;box-sizing:border-box;
      display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:19px;letter-spacing:5.5px;color:#ffd24a;text-transform:uppercase}
h1{margin:14px 0 0;font-size:96px;line-height:.95;letter-spacing:-3px;
   font-weight:800;color:#fdf3ea}
h1 span{color:#ffd24a}
.sub{margin:20px 0 0;font-size:27px;line-height:1.35;color:#d9c6b3;max-width:560px}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     font-size:20px;letter-spacing:.5px;color:#a38c77;white-space:nowrap}
</style></head><body>
<div class="maze"></div>
<div class="shade"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">Shockwave &amp; Flash &middot; 1997&ndash;2002</div>
    <h1>The 90s <span>Vault</span></h1>
    <div class="sub">Games built in a '90s agency lab, recovered from the Wayback Machine and playable again in a browser.</div>
  </div>
  <div class="url">lab.philipbaker.us/vault</div>
</div>
</body></html>
