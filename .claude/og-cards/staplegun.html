<!doctype html>
<!-- Source for /staplegun/img/og.jpg (1200x630). Render: see vault.html; then JPEG q84 with sips.
     Philip's brief (Sep 25 2026): one photo, full frame; the gunner guy on top, to one side, in
     white; nothing else. The photo is the page's own (staplegun/img/office/sg-office-01.jpg, the
     20th floor of City Place Tower); the gunner guy is rendered from Philip's gunnerguy.pdf
     (white art) into staplegun/gunner-guy.png. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#141417}
.photo{position:absolute;inset:0;background:url(../../staplegun/img/office/sg-office-01.jpg) 50% 50%/cover no-repeat}
/* the art is white on transparent, so the monitor's screen and its chin button are holes;
   fill them dark so the >> reads, the way it does on the original's black */
.guy{position:absolute;right:92px;bottom:38px;height:452px;aspect-ratio:648/1100;filter:drop-shadow(0 6px 22px rgba(0,0,0,.45))}
.guy i{position:absolute;background:#16161a}
.guy .screen{left:6.9%;top:3.9%;width:86.2%;height:24.5%;border-radius:1.5%}
.guy .button{left:82.2%;top:31.3%;width:9.9%;height:6.2%;border-radius:50%}
.guy img{position:relative;display:block;width:100%;height:100%}
</style></head><body>
<div class="photo"></div>
<div class="guy"><i class="screen"></i><i class="button"></i><img src="staplegun/gunner-guy.png" alt=""></div>
</body></html>
