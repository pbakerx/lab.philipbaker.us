<!doctype html>
<!-- Source for /staplegun/img/og.png. See vault.html for the render command.
     Every figure here is on the page itself: "Twenty years, 48 people, 111 films"
     and the 20th/19th/basement floors of City Place Tower. Nothing invented. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fafaf8}
body{font-family:Inter,-apple-system,system-ui,sans-serif;position:relative}
.rule{position:absolute;left:0;right:0;top:0;height:10px;background:#d93a49}
.wrap{position:absolute;inset:0;padding:78px 76px 66px;box-sizing:border-box;
      display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:18px;letter-spacing:5.5px;color:#d93a49;text-transform:uppercase}
h1{margin:16px 0 0;font-size:104px;line-height:.92;letter-spacing:-3.5px;
   font-weight:800;color:#141417}
.years{margin:12px 0 0;font-size:34px;font-weight:500;color:#73737c;letter-spacing:-.5px}
.sub{margin:22px 0 0;font-size:26px;line-height:1.36;color:#3c3c43;max-width:700px}
.foot{display:flex;align-items:flex-end;justify-content:space-between;gap:36px}
.stats{display:flex;gap:52px}
.stat .n{font-size:46px;font-weight:700;color:#141417;letter-spacing:-1.5px;line-height:1}
.stat .l{margin-top:7px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:13px;letter-spacing:2.4px;color:#73737c;text-transform:uppercase}
.url{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     font-size:19px;letter-spacing:.5px;color:#a4a4ad;white-space:nowrap;padding-bottom:6px}
</style></head><body>
<div class="rule"></div>
<div class="wrap">
  <div>
    <div class="eyebrow">My first startup</div>
    <h1>STAPLEGUN</h1>
    <div class="years">2001&ndash;2020 &middot; Oklahoma City</div>
    <div class="sub">From a kid's bedroom to three floors of City Place Tower. The agency, the reel, the whole story.</div>
  </div>
  <div class="foot">
    <div class="stats">
      <div class="stat"><div class="n">20</div><div class="l">years</div></div>
      <div class="stat"><div class="n">48</div><div class="l">people</div></div>
      <div class="stat"><div class="n">111</div><div class="l">films</div></div>
    </div>
    <div class="url">lab.philipbaker.us/staplegun</div>
  </div>
</div>
</body></html>
