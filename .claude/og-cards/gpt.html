<!doctype html>
<!-- Source for /GPT/img/og.png. See vault.html for the render command.
     gpt/land.png and gpt/attn.png are real canvas captures from the page (Copycat
     preset, ~3,000 steps): the loss landscape after the ball was dragged uphill and
     rolled back with "Stick to the map", and block 2 head 1 copying "grok>gr". -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c0e13}
body{font-family:Inter,-apple-system,system-ui,sans-serif;position:relative;color:#eef1f7}
.wrap{position:absolute;inset:0;padding:70px 64px 70px 72px;box-sizing:border-box;display:flex;align-items:center;gap:48px}
.left{flex:1 1 auto}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:18px;letter-spacing:5px;color:#b9ff66;text-transform:uppercase}
h1{margin:16px 0 0;font-size:92px;line-height:.95;letter-spacing:-3px;font-weight:800}
h1 span{color:#b9ff66}
.sub{margin:22px 0 0;font-size:28px;line-height:1.35;color:#9aa3b5;max-width:500px}
.url{margin:34px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:20px;color:#5d6679}
.art{flex:0 0 auto;position:relative;width:470px;height:470px}
.land{width:420px;height:420px;border-radius:22px;background:url(gpt/land.png) center/cover;
      border:1px solid #262c3a;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.attn{position:absolute;right:0;bottom:0;width:200px;height:200px;border-radius:16px;padding:10px;
      background:#141821 url(gpt/attn.png) center/190px auto no-repeat;border:1px solid #262c3a;box-shadow:0 16px 40px rgba(0,0,0,.7)}
</style></head><body>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">A real transformer</div>
    <h1>Pocket <span>GPT</span></h1>
    <div class="sub">Train it, talk to it, watch it pay attention, and push it around its own loss landscape.</div>
    <div class="url">lab.philipbaker.us/GPT</div>
  </div>
  <div class="art"><div class="land"></div><div class="attn"></div></div>
</div>
</body></html>
