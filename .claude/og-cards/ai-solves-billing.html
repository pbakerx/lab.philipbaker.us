<!doctype html>
<!-- Source for /ai-solves-billing/img/og.png. See vault.html for the render command.
     NOTE: /ai-solves-billing deliberately carries no real financial data — no client
     names, no rates, no revenue figures. This card must stay that way: the numbers
     below are the page's own struck example figures, not real ones. -->
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0b}
body{font-family:Inter,-apple-system,system-ui,sans-serif;position:relative}
.glow{position:absolute;inset:-25% -10% auto 30%;height:85%;
      background:radial-gradient(55% 100% at 70% 20%,rgba(99,102,241,.20),transparent 70%)}
.wrap{position:absolute;inset:0;padding:72px;box-sizing:border-box;
      display:flex;align-items:center;gap:54px}
.left{flex:1 1 auto}
.eyebrow{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
         font-size:18px;letter-spacing:5px;color:#6366f1;text-transform:uppercase}
h1{margin:16px 0 0;font-size:66px;line-height:1.04;letter-spacing:-2px;
   font-weight:700;color:#e8e8ed;max-width:560px}
.sub{margin:20px 0 0;font-size:25px;line-height:1.38;color:#9898a4;max-width:520px}
.url{margin:30px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
     font-size:19px;letter-spacing:.5px;color:#6b6b78}
.flow{flex:0 0 auto;width:352px;display:flex;flex-direction:column;gap:14px}
.step{background:#141416;border:1px solid #2a2a32;border-radius:14px;padding:18px 20px}
.step .k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
         letter-spacing:2.4px;color:#6b6b78;text-transform:uppercase}
.step .v{margin-top:7px;font-size:21px;color:#e8e8ed}
.arrow{text-align:center;color:#2a2a32;font-size:22px;line-height:1}
.done{border-color:rgba(34,197,94,.42);background:rgba(34,197,94,.10)}
.done .v{color:#22c55e}
</style></head><body>
<div class="glow"></div>
<div class="wrap">
  <div class="left">
    <div class="eyebrow">PB Productions &middot; case study</div>
    <h1>Billing, turned into a conversation</h1>
    <div class="sub">The chore that got ignored for years. Spoken timesheets in, invoices out, books current.</div>
    <div class="url">lab.philipbaker.us/ai-solves-billing</div>
  </div>
  <div class="flow">
    <div class="step"><div class="k">Say it</div><div class="v">&ldquo;Three hours on the edit&hellip;&rdquo;</div></div>
    <div class="arrow">&darr;</div>
    <div class="step"><div class="k">Drafted</div><div class="v">Line items, rates, hours</div></div>
    <div class="arrow">&darr;</div>
    <div class="step done"><div class="k">Sent</div><div class="v">Invoice in QuickBooks</div></div>
  </div>
</div>
</body></html>
