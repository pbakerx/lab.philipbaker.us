<!--
  THE SHOW.  To change what is on a slide, or the order of slides, edit slides.js.
  Nothing in this file or in js/engine.js needs touching for content.
-->
<div id="viewport">
  <main id="stage" aria-live="polite"></main>
</div>

<div id="chrome">
  <div id="count"></div>
  <div id="tools">

    <button id="bFull" title="Full screen (F)" aria-label="Full screen">⛶</button>
  </div>
  <div id="bar"><i></i></div>
</div>
