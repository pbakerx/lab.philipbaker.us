<style>
/* THE INTERFACE IS A HOLOGRAM, not a console. Nothing here has a solid face: every surface is a breath of glass with a fine luminous
   edge and two corner ticks, floating over a view that runs to all four edges of the screen. --ground / --friendly / --enemy are the
   original game's colour triad; main.js rewrites them with each city's scheme, so the page always wears the same colours as the world. */
:root{color-scheme:dark;--ink:#eef7fa;--ground:#f4ec66;--friendly:#66e5ff;--enemy:#ff533e;--dim:#8fa3ad;
 --f:Rajdhani,"Avenir Next Condensed","Segoe UI",system-ui,sans-serif;
 --line:color-mix(in srgb,var(--friendly) 42%,transparent);--haze:color-mix(in srgb,var(--friendly) 13%,transparent)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font:500 16px/1.4 var(--f)}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
[hidden]{display:none!important}
#app{position:fixed;inset:0}
#arena{position:absolute;inset:0;overflow:hidden}
#game,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;outline:none;cursor:crosshair}#over{pointer-events:none}

/* one surface, used everywhere */
.holo{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(6,18,26,.5),rgba(6,18,26,.16));-webkit-backdrop-filter:blur(9px) saturate(1.25);backdrop-filter:blur(9px) saturate(1.25);box-shadow:0 0 22px var(--haze),inset 0 0 26px color-mix(in srgb,var(--friendly) 6%,transparent)}
.holo:before,.holo:after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--friendly);filter:drop-shadow(0 0 4px var(--friendly));pointer-events:none}
.holo:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.holo:after{right:-1px;bottom:-1px;border-left:0;border-top:0}

/* the frame: four fine brackets at the corners of the world */
.corner{position:absolute;width:26px;height:26px;border:1px solid var(--line);opacity:.8;pointer-events:none}
.corner.tl{left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);border-right:0;border-bottom:0}.corner.tr{right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);border-left:0;border-bottom:0}
.corner.bl{left:calc(env(safe-area-inset-left) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);border-right:0;border-top:0}.corner.br{right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 10px);border-left:0;border-top:0}

/* readouts */
.read{display:grid;gap:0;padding:5px 14px 6px;min-width:96px}
.read label,.tag{font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:color-mix(in srgb,var(--friendly) 78%,#fff);opacity:.85;white-space:nowrap}
.read strong{font-size:24px;font-weight:600;letter-spacing:.05em;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 0 12px color-mix(in srgb,var(--friendly) 70%,transparent);white-space:nowrap}
.read.big strong{font-size:34px}#high{color:var(--ground);text-shadow:0 0 12px color-mix(in srgb,var(--ground) 60%,transparent)}
#cityname{font-size:19px;color:var(--ground);text-shadow:0 0 12px color-mix(in srgb,var(--ground) 55%,transparent)}
#hudL,#hudR{position:absolute;top:calc(env(safe-area-inset-top) + 22px);display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#hudL{left:calc(env(safe-area-inset-left) + 24px)}#hudR{right:calc(env(safe-area-inset-right) + 224px)}

/* the radar: hung high and central, with a wing to either side that ties it into the rest */
#radarbox{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 12px);width:clamp(150px,27vh,236px);aspect-ratio:1;transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 0 14px var(--haze))}
#radar{width:100%;height:100%;display:block}
#radarbox .wing{position:absolute;top:50%;width:clamp(60px,11vw,150px);height:1px;background:linear-gradient(90deg,transparent,var(--friendly));opacity:.55}
#radarbox .wing.l{right:100%}#radarbox .wing.r{left:100%;transform:scaleX(-1)}
#radarbox .wing span{position:absolute;bottom:5px;right:8px;font-size:10.5px;font-weight:600;letter-spacing:.22em;color:var(--friendly);white-space:nowrap}
#radarbox .wing.r span{transform:scaleX(-1);right:auto;left:8px;text-align:left}
#radarbox .wing b{font-weight:700;color:var(--ink)}

/* tools: icons, not words */
#tools{position:absolute;top:calc(env(safe-area-inset-top) + 26px);right:calc(env(safe-area-inset-right) + 86px);display:flex;gap:8px}
#tools button{width:40px;height:40px;display:grid;place-items:center;padding:0;color:var(--friendly);cursor:pointer;font:inherit;touch-action:manipulation;transition:color .15s,box-shadow .15s,background .15s}
#tools button:hover{color:#fff;box-shadow:0 0 26px color-mix(in srgb,var(--friendly) 45%,transparent)}#tools button:active{background:color-mix(in srgb,var(--friendly) 22%,transparent)}
#tools button:focus-visible,#menu button:focus-visible{outline:1px solid #fff;outline-offset:3px}
#tools button:disabled{opacity:.3;cursor:default;box-shadow:none}
#tools svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 5px currentColor)}
#sound[aria-pressed=true] .off,#sound[aria-pressed=false] .on,#pause .go,#pause.on .hold{display:none}#pause.on .go{display:block}#sound[aria-pressed=false]{color:var(--dim)}

/* base camp: three segmented gauges along the bottom */
#camp{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);display:flex;align-items:center;gap:20px;padding:9px 20px 10px;pointer-events:none;white-space:nowrap}
#link{display:grid;gap:3px;color:var(--friendly)}#link .bars{display:flex;gap:3px;align-items:flex-end;height:14px}
#link .bars i{width:4px;background:currentColor;box-shadow:0 0 7px currentColor;animation:sig 1.3s infinite}#link .bars i:nth-child(1){height:5px}#link .bars i:nth-child(2){height:8px;animation-delay:.12s}#link .bars i:nth-child(3){height:11px;animation-delay:.24s}#link .bars i:nth-child(4){height:14px;animation-delay:.36s}
#link.lost{color:var(--enemy)}#link.lost .bars i{animation:dead .18s infinite}
@keyframes sig{0%,100%{opacity:1}50%{opacity:.35}}@keyframes dead{50%{opacity:.1}}
.pad{display:grid;gap:3px}.pad .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px}.pad b{font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.pad u{display:block;width:110px;height:7px;text-decoration:none;background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--friendly) 20%,transparent) 0 8px,transparent 8px 11px)}
.pad u i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--friendly) 0 8px,transparent 8px 11px);filter:drop-shadow(0 0 5px var(--friendly));transition:width .18s}
.pad.out .tag,.pad.out b{color:var(--enemy)}.pad.out u{background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--enemy) 30%,transparent) 0 8px,transparent 8px 11px)}
#total{display:grid;justify-items:end;padding-left:18px;border-left:1px solid var(--line)}#ammo-total{font-size:34px;font-weight:600;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 0 14px color-mix(in srgb,var(--friendly) 70%,transparent)}

/* words that arrive in the sky */
#intro{position:absolute;left:0;right:0;top:36%;display:grid;justify-items:center;gap:6px;pointer-events:none;text-align:center;text-shadow:0 0 4px #000,0 0 22px rgba(0,0,0,.9)}
#intro .w{font-size:clamp(26px,5vw,56px);font-weight:500;letter-spacing:.3em;text-indent:.3em;color:#fff;text-shadow:0 0 24px var(--ground),0 0 4px #000;animation:arrive .9s cubic-bezier(.16,1,.3,1) both}
#intro .m{font-size:clamp(13px,1.9vw,19px);font-weight:600;letter-spacing:.4em;color:var(--friendly)}#intro .d{margin-top:8px;font-size:clamp(14px,2vw,20px);font-weight:600;letter-spacing:.3em;color:var(--ground)}
#intro .k{max-width:min(92%,900px);margin-top:4px;font-size:clamp(10px,1.3vw,13px);font-weight:500;letter-spacing:.18em;color:var(--ink);opacity:.72}
@keyframes arrive{from{opacity:0;letter-spacing:.9em;filter:blur(8px)}}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + clamp(150px,27vh,236px) + 34px);transform:translateX(-50%);padding:5px 18px 6px;font-size:14px;font-weight:600;letter-spacing:.26em;color:var(--ground);white-space:nowrap;pointer-events:none;text-shadow:0 0 10px color-mix(in srgb,var(--ground) 60%,transparent)}

/* panels */
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(ellipse at center,rgba(0,4,8,.62),rgba(0,3,6,.3) 70%,rgba(0,3,6,.12));padding:20px 24px;touch-action:pan-y}
.panel{width:min(900px,100%);max-height:100%;overflow:auto;scrollbar-width:thin;padding:clamp(18px,3.4vw,40px);border:1px solid var(--line);position:relative;
 background:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px),linear-gradient(160deg,rgba(6,20,30,.72),rgba(4,12,18,.5));
 -webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 0 60px var(--haze),inset 0 0 70px color-mix(in srgb,var(--friendly) 5%,transparent);animation:panel .45s cubic-bezier(.16,1,.3,1) both}
.panel:before,.panel:after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--friendly);filter:drop-shadow(0 0 6px var(--friendly));pointer-events:none}
.panel:before{left:0;top:0;border-right:0;border-bottom:0}.panel:after{right:0;bottom:0;border-left:0;border-top:0}   /* INSIDE the box: a tick that overhangs by a pixel makes the panel scroll, and the scrollbars read as a grey bevel */
@keyframes panel{from{opacity:0;transform:translateY(10px) scale(.985);filter:blur(6px)}}
.home-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(18px,4vw,44px);align-items:center}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.5em;color:var(--enemy);margin:0 0 10px;text-shadow:0 0 12px color-mix(in srgb,var(--enemy) 60%,transparent)}
.title{font-size:clamp(46px,9vw,124px);line-height:.84;letter-spacing:.03em;margin:0 0 16px;font-weight:700;background:linear-gradient(100deg,#fff 10%,var(--friendly) 45%,#fff 60%,var(--ground));background-size:240% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--friendly) 55%,transparent));animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-240% 0}}
h2{font-size:clamp(22px,3.4vw,34px);font-weight:600;letter-spacing:.22em;line-height:1.1;margin:0 0 14px;color:#fff;text-shadow:0 0 18px var(--ground)}
:where(#app,#gate,#boot) p{margin:8px 0 14px;font-size:16px;color:#c4d3da}.muted{font-size:13px;letter-spacing:.06em;color:var(--dim)}
.instructions{font-size:16px;margin:0;line-height:1.55}.instructions b{color:var(--friendly);font-weight:700;letter-spacing:.08em}.line{border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.center{text-align:center}.center .actions{justify-content:center}
#menu button{font:600 15px/1 var(--f);letter-spacing:.24em;text-indent:.24em;color:var(--friendly);cursor:pointer;touch-action:manipulation;min-height:46px;padding:0 24px;border:1px solid var(--line);background:color-mix(in srgb,var(--friendly) 7%,transparent);transition:box-shadow .15s,background .15s,color .15s;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
#menu button:hover{color:#fff;background:color-mix(in srgb,var(--friendly) 18%,transparent)}#menu button:disabled{opacity:.35;cursor:default}
#menu button.primary{color:#04141b;border-color:transparent;background:linear-gradient(100deg,var(--ground),color-mix(in srgb,var(--ground) 62%,#fff));font-weight:700;filter:drop-shadow(0 0 14px color-mix(in srgb,var(--ground) 55%,transparent))}
#menu button.primary:hover{filter:drop-shadow(0 0 24px var(--ground)) brightness(1.08)}
table{border-collapse:collapse;width:100%;font-size:17px;font-variant-numeric:tabular-nums}td,th{padding:6px 10px;text-align:left}th{font-size:11px;font-weight:600;letter-spacing:.24em;color:var(--friendly);border-bottom:1px solid var(--line)}td:last-child,th:last-child{text-align:right}tr:first-child td{color:var(--ground)}
.score-number{font-size:clamp(38px,6vw,64px);font-weight:600;letter-spacing:.06em;line-height:1;text-shadow:0 0 22px var(--friendly)}
.bonus-grid{display:grid;grid-template-columns:auto auto;gap:8px 36px;max-width:440px;margin:18px auto;text-align:left;font-size:17px;letter-spacing:.1em}.bonus-grid b{text-align:right;color:var(--friendly);font-variant-numeric:tabular-nums}
.initials{display:flex;gap:12px;justify-content:center;margin:12px 0}.letter{display:grid;gap:4px;min-width:58px;justify-items:center}.letter span{font-size:40px;font-weight:600;line-height:1;color:#fff;border-bottom:2px solid var(--line);padding:0 8px 2px;text-shadow:0 0 14px var(--friendly)}.letter.on span{border-color:var(--ground);text-shadow:0 0 16px var(--ground)}
#menu .letter button{min-height:32px;padding:0 16px;letter-spacing:0;text-indent:0;clip-path:none}

#boot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at center,#04111a,#000 70%);padding:24px;transition:opacity .7s}#boot.done{opacity:0;pointer-events:none}#boot a{color:var(--friendly)}

#gate section{max-width:470px}.rotate-icon{font-size:55px;color:var(--friendly);line-height:1;margin-bottom:20px;text-shadow:0 0 18px var(--friendly)}

<body>
<main id="app">
 <section id="arena" aria-label="The city, from the air">
