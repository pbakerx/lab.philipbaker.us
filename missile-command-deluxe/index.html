<style>
/* --ground / --friendly / --enemy are the original game's colour triad. main.js rewrites them with each city's scheme, so the page wears the same colours as the world. */
:root{color-scheme:dark;--ink:#e9eeee;--ground:#f4ec66;--friendly:#66e5ff;--enemy:#ff533e;--dim:#96a2a9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
body{overscroll-behavior:none;user-select:none;-webkit-user-select:none}
/* :where(#app) keeps these at plain-element specificity while stopping them at the game's edge — unscoped, they restyle the lab's shared hamburger and its Close button. */
:where(#app) button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;min-height:44px;border:1px solid #394349;border-radius:0;background:#101619;padding:8px 14px}
:where(#app) button:active{background:#263239}:where(#app) button:focus-visible{outline:2px solid var(--friendly);outline-offset:2px}
:where(#app) button[aria-pressed=true]{border-color:var(--friendly);color:var(--friendly);background:#102027}
:where(#app) button:disabled{opacity:.4;cursor:default}:where(#app) button.primary{background:var(--ground);border-color:var(--ground);color:#111;font-weight:900}
[hidden]{display:none!important}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud{height:48px;flex:none;display:flex;align-items:center;gap:18px;padding:0 62px 0 14px;border-bottom:1px solid #172126}
.stat{white-space:nowrap;display:flex;gap:9px;align-items:baseline;font-size:14px;color:var(--dim)}
.stat strong{font-size:20px;letter-spacing:1px;color:var(--friendly);font-weight:700;font-variant-numeric:tabular-nums}
#high{color:var(--ground)}#level,#reserve{color:var(--ink)}#cityname{color:var(--ground);font-size:13px;letter-spacing:1px}
.hud-actions{display:flex;margin-left:auto;gap:6px}.hud-actions button{padding:4px 10px;font-size:13px;min-height:40px}
#arena{position:relative;flex:1;min-height:0;overflow:hidden}
#game,#over{position:absolute;inset:0;width:100%;height:100%;display:block}
#game{touch-action:none;outline:none;cursor:crosshair}#over{pointer-events:none}
/* the instruments: radar bottom-left, pads and uplink bottom-right */
#radarbox{position:absolute;left:12px;bottom:12px;width:clamp(124px,24vh,196px);aspect-ratio:1;touch-action:none}
#radar{width:100%;height:100%;display:block;border-radius:50%;cursor:crosshair;touch-action:none}
#radarbox span{position:absolute;left:0;right:0;top:-17px;text-align:center;font-size:10px;letter-spacing:2px;color:var(--friendly);opacity:.75;pointer-events:none;text-shadow:0 0 6px #000}
#camp{position:absolute;right:12px;bottom:12px;display:grid;gap:4px;width:clamp(150px,22vw,210px);pointer-events:none;text-shadow:0 0 6px #000,0 1px 2px #000}
#camp header{display:flex;justify-content:space-between;align-items:baseline;font-size:10px;letter-spacing:2px;color:var(--friendly);opacity:.85}
#ammo-total{font-size:24px;font-weight:800;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.pad{display:grid;grid-template-columns:52px 1fr 20px;gap:7px;align-items:center;font-size:11px;letter-spacing:1px;color:var(--dim)}
.pad u{display:block;height:6px;background:#0c1418cc;border:1px solid #2a353b;text-decoration:none}.pad i{display:block;height:100%;background:var(--friendly);box-shadow:0 0 8px var(--friendly)}
.pad b{text-align:right;color:var(--ink);font-variant-numeric:tabular-nums}.pad.out{color:var(--enemy)}.pad.out b{color:var(--enemy)}
#link{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:10px;letter-spacing:2px;color:var(--friendly)}
#link:before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor;animation:beat 1.1s infinite}
#link.lost{color:var(--enemy)}#link.lost:before{animation-duration:.22s}
@keyframes beat{50%{opacity:.25}}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:auto;background:radial-gradient(ellipse at center,rgba(0,3,7,.8),rgba(0,2,5,.46) 72%,rgba(0,2,5,.28));-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);padding:14px 24px;touch-action:pan-y}
.panel{width:min(850px,100%);max-height:100%;overflow:auto;scrollbar-width:thin;text-shadow:0 1px 2px #000,0 0 14px rgba(0,0,0,.85)}
.home-grid{display:grid;grid-template-columns:1.15fr 1fr;gap:32px;align-items:center}
.eyebrow{font-size:12px;font-weight:400;letter-spacing:3px;color:var(--enemy);margin:0 0 8px}
.title{font-size:clamp(34px,7vw,84px);line-height:.92;letter-spacing:-2px;margin:0 0 15px;font-weight:900;color:var(--ground);text-shadow:0 0 28px color-mix(in srgb,var(--ground) 55%,transparent),0 2px 3px #000}
h2{font-size:24px;line-height:1.1;margin:0 0 14px;color:var(--ground)}
:where(#app,#gate,#boot) p{margin:8px 0 14px;font-size:14px;color:#b4c0c6}.muted{font-size:12px;color:var(--dim)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.center{text-align:center}.center .actions{justify-content:center}
.instructions{font-size:14px;margin:0;line-height:1.65}.instructions b{color:var(--friendly)}.line{border-top:1px solid #273036;padding-top:10px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}td,th{padding:4px 8px;text-align:left}th{font-size:12px;font-weight:400;color:var(--dim);border-bottom:1px solid #293337}td:last-child,th:last-child{text-align:right}
.score-number{font-size:30px;color:var(--friendly);font-weight:800}.bonus-grid{display:grid;grid-template-columns:auto auto;gap:7px 30px;max-width:400px;margin:16px auto;text-align:left}.bonus-grid b{text-align:right;color:var(--friendly)}
.initials{display:flex;gap:9px;justify-content:center;margin:10px 0}.letter{display:grid;gap:2px;min-width:52px}.letter span{font-size:27px;color:var(--friendly)}.letter.on span{color:var(--ground)}.letter button{padding:0 12px;min-height:36px}
#intro{position:absolute;left:0;right:0;top:22%;display:grid;justify-items:center;gap:8px;pointer-events:none;text-align:center;font-weight:900;text-shadow:0 0 3px #000,0 0 18px rgba(0,0,0,.95)}
#intro .w{font-size:clamp(22px,4.4vw,40px);letter-spacing:2px;color:var(--ground)}#intro .m{font-size:clamp(14px,2.4vw,20px);color:var(--friendly)}#intro .d{margin-top:8px;font-size:clamp(13px,2vw,17px);color:#fff}#intro .k{max-width:92%;font-size:clamp(10px,1.4vw,13px);color:var(--dim);font-weight:400}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);padding:5px 12px;background:#060e12e8;border:1px solid #1d2a30;color:var(--ground);font-size:14px;white-space:nowrap;pointer-events:none}
#boot{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;text-align:center;background:#010305;padding:24px;transition:opacity .6s}#boot.done{opacity:0;pointer-events:none}#boot a{color:var(--friendly)}
#gate{position:fixed;inset:0;z-index:20;background:#030607;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#gate section{max-width:470px}.rotate-icon{font-size:55px;color:var(--friendly);line-height:1;margin-bottom:20px}#gate p{font-size:16px}
/* The lab's shared menu pins its hamburger at top:26px/right:28px, which here is the PAUSE button. Seat it in the HUD instead (the HUD reserves the room with padding-right), and let the drawer scroll: its links outgrow a phone held sideways. */
#pb-menu .hamburger{top:calc(env(safe-area-inset-top) + 4px);right:calc(env(safe-area-inset-right) + 12px)}
#pb-menu .drawer{overflow-y:auto;padding-right:calc(env(safe-area-inset-right) + 44px)}
#pb-menu .drawer-close{right:calc(env(safe-area-inset-right) + 44px)}
@media(max-height:480px){#pb-menu .drawer{padding-top:64px;padding-bottom:24px}}
@media(max-height:360px){#pb-menu .hamburger{top:calc(env(safe-area-inset-top) + 1px)}#hud{height:42px;gap:12px}.stat strong{font-size:17px}.overlay{padding:10px 18px}.title{font-size:40px;margin-bottom:8px}h2{font-size:21px;margin-bottom:8px}.eyebrow{margin-bottom:5px}.panel p{margin:5px 0 8px}.actions{margin-top:8px}.home-grid{gap:20px}.instructions{font-size:12px;line-height:1.5}}
@media(max-width:760px){#hud{gap:11px;padding:0 58px 0 8px}.stat{font-size:12px;gap:5px}.stat strong{font-size:17px}.reserve-stat,#cityname{display:none}.hud-actions button{font-size:12px;padding:3px 7px}.home-grid{gap:18px}#radarbox{left:8px;bottom:8px}#camp{right:8px;bottom:8px}}
</style>

</head>
<body>
<main id="app">
 <header id="hud">
  <div class="stat">SCORE <strong id="score">0</strong></div>
  <div class="stat">HIGH <strong id="high">0</strong></div>
  <div class="stat">CITY <strong id="level">1</strong><span id="cityname">EUREKA</span><span id="mult">1×</span></div>
  <div class="stat reserve-stat">RESERVE <strong id="reserve">0</strong></div>
  <div class="hud-actions"><button id="sound" aria-label="Toggle sound" aria-pressed="true">SOUND</button><button id="pause" aria-label="Pause game" disabled>PAUSE</button></div>
 </header>
 <section id="arena" aria-label="The city, from the air">
  <canvas id="game" aria-label="Tap or click the sky ahead of a falling missile to call a strike from base camp. Drag, or use W A S D, to fly. Tap the radar to strike what you cannot see."></canvas>
  <canvas id="over" aria-hidden="true"></canvas>
  <div id="radarbox"><span>RADAR</span><canvas id="radar" aria-label="Radar. Tap a blip to call a strike there."></canvas></div>
  <div id="camp" aria-label="Base camp">
   <header><span>BASE CAMP · AUTO</span><span id="ammo-total">30</span></header>
   <div class="pad" data-pad="0"><span>ALPHA</span><u><i></i></u><b>10</b></div>
   <div class="pad" data-pad="1"><span>DELTA</span><u><i></i></u><b>10</b></div>
   <div class="pad" data-pad="2"><span>OMEGA</span><u><i></i></u><b>10</b></div>
   <div id="link"><span id="link-word">UPLINK</span></div>
  </div>
  <div id="intro" aria-live="polite" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="menu" class="overlay" hidden></div>
 </section>
</main>
<div id="boot"><section><h1 class="eyebrow">MISSILE COMMAND DELUXE · CITY RUN</h1><h2 id="boot-line">RAISING THE CITY…</h2><p id="boot-note" class="muted"></p></section></div>
<div id="gate" hidden><section>
 <div class="rotate-icon" aria-hidden="true">↻</div>
 <h2>ROTATE YOUR DEVICE</h2>
 <p>Hold your phone or tablet horizontally. Your game stays paused.</p>
</section></div>

<script>
// A module that cannot load or cannot parse fails SILENTLY. Say so plainly, and point at the version that needs nothing.
window.__mcdFail=function(why){var l=document.getElementById('boot-line'),n=document.getElementById('boot-note');document.getElementById('boot').classList.remove('done');l.textContent='THE GAME COULD NOT START';n.innerHTML=(why?String(why).replace(/[<&]/g,'')+'<br>':'')+'Check the connection and <a href="" onclick="location.reload();return false">reload</a> — or play the 2D original: <a href="/missile-command/">/missile-command</a>';};
setTimeout(function(){if(window.__mcdReady)return;var l=document.getElementById('boot-line'),n=document.getElementById('boot-note');if(!l||/COULD NOT/.test(l.textContent))return;
 l.textContent='STILL LOADING…';n.innerHTML='If this never finishes, your browser may be too old for the 3D world. The original, drawn in 2D, plays anywhere: <a href="/missile-command/">/missile-command</a>';},9000);
</script>
