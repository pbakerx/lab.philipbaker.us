<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Honda Acura Fall Digital — Version 1</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Honda + Acura Fall 2026 seasonal HTML5 display — Version 1, 3 example sizes.">
<style>
  :root {
    --ink: #f1f5f9;
    --ink-dim: #b6c2d2;
    --ink-faint: #7c8ba1;
    --ground: #1e293b;   /* slate-800 — same ground for page and card */
    --panel: #263447;
    --line: #334155;
    --accent: #d9b96c;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --sans: -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--ground); }
  body {
    background: var(--ground); color: var(--ink);
    font: 16px/1.6 var(--sans);
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wrap { width: 100%; max-width: 900px; margin: 0 auto; padding: 0 20px; }

  /* ---------- masthead ---------- */
  header { padding: 24px 0 4px; text-align: center; }
  .eyebrow {
    font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 8px;
  }
  h1 {
    font-family: var(--serif); font-weight: 400; letter-spacing: .01em;
    font-size: clamp(21px, 4vw, 28px); line-height: 1.15; display: inline;
  }
  .version {
    margin-top: 4px; font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .rule {
    width: 36px; height: 1px; background: var(--accent);
    margin: 14px auto 0; opacity: .8;
  }

  /* ---------- brand tabs ---------- */
  .brands { display: flex; justify-content: center; gap: 32px; padding: 12px 0 2px; }
  .brand {
    background: none; border: 0; cursor: pointer; color: var(--ink-dim);
    font-family: var(--serif); font-size: 18px; letter-spacing: .04em;
    padding: 5px 2px; border-bottom: 1px solid transparent; transition: color .25s, border-color .25s;
  }
  .brand[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
  .brand:hover { color: var(--ink); }

  /* ---------- dealer pulldown ---------- */
  .dealer-row { display: flex; justify-content: center; align-items: baseline;
                gap: 10px; padding: 18px 0 0; }
  .dealer-label {
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--ink-faint);
  }
  #dealerSel {
    -webkit-appearance: none; appearance: none;
    background: transparent; color: var(--ink-dim); cursor: pointer;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    font: 13px/1.5 var(--sans); letter-spacing: .03em;
    padding: 4px 22px 5px 2px; max-width: min(64vw, 380px);
    text-overflow: ellipsis;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23d9b96c' stroke-width='1.4'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 4px center;
  }
  #dealerSel:hover, #dealerSel:focus { color: var(--ink); border-bottom-color: var(--accent); outline: none; }
  #dealerSel option { background: var(--ground); color: var(--ink); }

  /* ---------- pickers ---------- */
  .pickers { padding: 8px 0 2px; }
  .group { display: flex; align-items: baseline; justify-content: center;
           gap: 14px; flex-wrap: wrap; padding: 4px 0; }
  .group-name {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--ink-faint); min-width: 148px; text-align: right;
  }
  .chips { display: flex; gap: 8px; }
  .chip {
    background: none; cursor: pointer; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 999px;
    font: 12.5px/1 var(--sans); letter-spacing: .04em;
    padding: 8px 14px; transition: all .2s;
  }
  .chip:hover { border-color: var(--ink-faint); color: var(--ink); }
  .chip[aria-selected="true"] {
    border-color: var(--accent); color: var(--ground);
    background: var(--accent);
  }

  /* ---------- stage ---------- */
  .stage-outer { padding: 16px 0 10px; }
  .stage-meta {
    display: flex; justify-content: center; align-items: baseline; gap: 18px;
    padding-bottom: 10px; flex-wrap: wrap;
  }
  .unit-name { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-dim); }
  .stage {
    display: flex; justify-content: center;
  }
  /* no card at all — the ad plants directly on the slate ground */
  .slot {
    background: var(--ground); padding: 14px;
  }
  .fit { position: relative; overflow: hidden; }
  .fit iframe { border: 0; display: block; background: #fff; transform-origin: 0 0; }

  /* ---------- timeline ---------- */
  .timeline {
    display: flex; align-items: center; gap: 12px;
    max-width: 460px; margin: 16px auto 0; padding: 0 6px;
  }
  .timeline input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none; height: 2px;
    background: var(--line); border-radius: 1px; outline: none; cursor: pointer;
  }
  .timeline input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: var(--accent); border: 0; cursor: pointer;
  }
  .timeline input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: 0; cursor: pointer;
  }
  .timecode {
    font: 11px/1 ui-monospace, Menlo, monospace; color: var(--ink-faint);
    min-width: 62px; text-align: right; letter-spacing: .04em;
  }
  .controls {
    display: flex; justify-content: center; gap: 26px; padding: 12px 0 0;
  }
  .ctl {
    background: none; border: 0; cursor: pointer; color: var(--ink-dim);
    font: 13px/1 var(--sans); letter-spacing: .1em; text-transform: uppercase;
    padding: 8px 2px; border-bottom: 1px solid transparent;
    text-decoration: none; transition: color .2s, border-color .2s;
  }
  .ctl:hover { color: var(--accent); border-bottom-color: var(--accent); }

  /* ---------- storyboard modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 50; display: none;
    background: rgba(15,23,42,.95);
  }
  .modal.open { display: block; }
  .modal-scroll {
    position: absolute; inset: 0; overflow: auto;
    -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y pinch-zoom;
    display: flex; padding: 56px 0 30px;
  }
  .modal-scroll img {
    margin: auto; display: block; background: #fff;
    width: min(96vw, 1400px); max-width: none; cursor: zoom-in;
  }
  .modal-scroll img.zoomed { width: 2400px; cursor: zoom-out; }
  .modal-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 51;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 18px;
    background: linear-gradient(to bottom, rgba(15,23,42,.9), rgba(15,23,42,0));
  }
  .modal-title { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink-dim); }
  .modal-close {
    background: none; border: 1px solid var(--line); border-radius: 999px;
    color: var(--ink); font: 13px/1 var(--sans); letter-spacing: .08em;
    padding: 9px 18px; cursor: pointer;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }
  .modal-hint {
    position: fixed; bottom: 10px; left: 0; right: 0; text-align: center;
    font-size: 11px; letter-spacing: .1em; color: var(--ink-faint); pointer-events: none;
  }

  /* ---------- footer ---------- */
  footer {
    margin-top: auto; padding: 64px 0 26px; text-align: center;
  }
  footer p { font-size: 11.5px; letter-spacing: .06em; color: var(--ink-faint); }
  footer a { color: var(--ink-faint); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--ink-dim); }

  @media (max-width: 560px) {
    header { padding-top: 38px; }
    .group { flex-direction: column; align-items: center; gap: 8px; }
    .group-name { text-align: center; min-width: 0; }
    .slot { padding: 10px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Fall 2026 · Seasonal Display</div>
    <h1>Honda&nbsp;Acura Fall&nbsp;Digital</h1>
    <div class="version">Version 1 &middot; 3 Example Sizes</div>
    <div class="rule"></div>
  </header>

  <nav class="brands" role="tablist" aria-label="Brand">
    <button class="brand" role="tab" data-brand="HND" aria-selected="true">Honda</button>
    <button class="brand" role="tab" data-brand="ACR" aria-selected="false">Acura</button>
  </nav>

  <div class="pickers" id="pickers"></div>

  <section class="stage-outer">
    <div class="stage-meta">
      <span class="unit-name" id="unitName"></span>
    </div>
    <div class="stage">
      <div class="slot"><div class="fit" id="fit"><iframe id="adFrame" scrolling="no" title="Ad preview"></iframe></div></div>
    </div>
    <div class="timeline">
      <input type="range" id="scrub" min="0" max="9000" step="50" value="0" aria-label="Timeline">
      <span class="timecode" id="timecode">0.0 / 9.0s</span>
    </div>
    <div class="controls">
      <button class="ctl" id="replay">&#8635;&nbsp; Replay</button>
      <button class="ctl" id="seeBoard">See Storyboard</button>
    </div>
    <div class="dealer-row">
      <span class="dealer-label">Dealer</span>
      <select id="dealerSel" aria-label="Dealer"></select>
    </div>
  </section>

  <footer>
    <p>software by <a href="https://philipbaker.us">philipbaker.us</a></p>
  </footer>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-bar">
    <span class="modal-title" id="modalTitle"></span>
    <button class="modal-close" id="modalClose">Back to the work</button>
  </div>
  <div class="modal-scroll" id="modalScroll"><img id="boardImg" alt="Storyboard"></div>
  <div class="modal-hint">tap image to zoom &middot; tap outside or esc to close</div>
</div>

<script src="dealers.js"></script>
<script>
const SIZES = [
  { key: '728x90',  w: 728, h: 90,  label: '728 × 90'  },
  { key: '160x600', w: 160, h: 600, label: '160 × 600' },
  { key: '320x50',  w: 320, h: 50,  label: '320 × 50'  },
];
const CREATIVES = {
  HND: [
    { key: 'A', name: 'Creative A — Passport' },
    { key: 'B', name: 'Creative B — Fall Rush' },
  ],
  ACR: [
    { key: 'A', name: 'Creative A — Precision Service' },
    { key: 'B', name: 'Creative B — Breeze Through Fall' },
  ],
};
const CLICK_URL = {
  HND: 'https://automobiles.honda.com/tools/dealership-locator',
  ACR: 'https://www.acura.com/service',
};
const DEFAULT_DEALER = {
  HND: 'Norm Reeves Honda Superstore Huntington Beach',
  ACR: 'Open Road Acura of East Brunswick',
};
const state = { brand: 'HND', size: '728x90', creative: 'A',
                dealer: { HND: null, ACR: null } };
for (const b of ['HND', 'ACR']) {
  const i = DEALER_FEED[b].findIndex(d => d[1] === DEFAULT_DEALER[b]);
  state.dealer[b] = i >= 0 ? i : 0;
}
const dealerSel = document.getElementById('dealerSel');
function renderDealers() {
  dealerSel.innerHTML = DEALER_FEED[state.brand].map((d, i) =>
    `<option value="${i}" ${i === state.dealer[state.brand] ? 'selected' : ''}>${d[1]}</option>`).join('');
}
dealerSel.addEventListener('change', () => {
  state.dealer[state.brand] = +dealerSel.value; loadAd();
});
const tplCache = {};
async function unitHtml(id) {
  if (!tplCache[id]) {
    tplCache[id] = await (await fetch(`ads/${id}/template.html`)).text();
  }
  const d = DEALER_FEED[state.brand][state.dealer[state.brand]];
  return tplCache[id]
    .replace('<head>', `<head><base href="ads/${id}/">`)
    .replaceAll('{{DEALER_NAME}}', d[1])
    .replaceAll('{{DEALER_ID}}', d[0])
    .replaceAll('{{CLICK_URL}}', CLICK_URL[state.brand]);
}

const pickersEl = document.getElementById('pickers');
const frame = document.getElementById('adFrame');
const fit = document.getElementById('fit');
const unitName = document.getElementById('unitName');

function unitId() { return `${state.brand}_${state.size}_${state.creative}`; }

function renderPickers() {
  pickersEl.innerHTML = CREATIVES[state.brand].map(c => `
    <div class="group">
      <span class="group-name">${c.name}</span>
      <span class="chips">${SIZES.map(s => `
        <button class="chip" data-creative="${c.key}" data-size="${s.key}"
          aria-selected="${state.creative === c.key && state.size === s.key}">${s.label}</button>`).join('')}
      </span>
    </div>`).join('');
  pickersEl.querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => {
    state.creative = b.dataset.creative; state.size = b.dataset.size;
    renderPickers(); loadAd();
  }));
}

function sizeOf() { return SIZES.find(s => s.key === state.size); }

function layoutFrame() {
  const s = sizeOf();
  const pad = 68; // page padding + slot padding
  const scale = Math.min(1, (document.documentElement.clientWidth - pad) / s.w);
  frame.width = s.w; frame.height = s.h;
  frame.style.width = s.w + 'px'; frame.style.height = s.h + 'px';
  frame.style.transform = `scale(${scale})`;
  fit.style.width = (s.w * scale) + 'px';
  fit.style.height = (s.h * scale) + 'px';
}

/* ---------- timeline ---------- */
const scrub = document.getElementById('scrub');
const timecode = document.getElementById('timecode');
let playT0 = null;      // wall-clock start while playing; null once scrubbed
let adDur = 9000;

function fmt(ms) { return (ms / 1000).toFixed(1); }
function measureDur() {
  // the last WAAPI cue's end is the ad's effective length
  try {
    const anims = frame.contentWindow.document.getAnimations();
    const end = Math.max(...anims.map(a => {
      const t = a.effect.getTiming();
      return (Number(t.delay) || 0) + (Number(t.duration) || 0);
    }));
    if (isFinite(end) && end > 1000) adDur = Math.max(end, 8500);
  } catch (e) { adDur = 9000; }
  scrub.max = adDur;
}
frame.addEventListener('load', () => { playT0 = performance.now(); measureDur(); });
setInterval(() => {
  if (playT0 == null) return;
  const t = Math.min(adDur, performance.now() - playT0);
  scrub.value = t;
  timecode.textContent = `${fmt(t)} / ${fmt(adDur)}s`;
}, 120);
scrub.addEventListener('input', () => {
  playT0 = null;        // scrubbing takes over: the ad parks on the chosen frame
  const t = +scrub.value;
  try { frame.contentWindow.__adSeek(t); } catch (e) {}
  timecode.textContent = `${fmt(t)} / ${fmt(adDur)}s`;
});

async function loadAd() {
  const id = unitId();
  layoutFrame();
  playT0 = null;
  scrub.value = 0;
  frame.srcdoc = await unitHtml(id);
  unitName.textContent = id.replace(/_/g, ' · ');
  // warm the storyboard for a fast peek
  const img = new Image();
  img.src = boardSrc();
}

function boardSrc() { return `boards/${state.brand.toLowerCase()}_${state.size}.jpg`; }

document.querySelectorAll('.brand').forEach(b => b.addEventListener('click', () => {
  state.brand = b.dataset.brand;
  document.querySelectorAll('.brand').forEach(x =>
    x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
  renderDealers(); renderPickers(); loadAd();
}));
document.getElementById('replay').addEventListener('click', loadAd);
window.addEventListener('resize', layoutFrame);

/* ---------- storyboard peek ---------- */
const modal = document.getElementById('modal');
const boardImg = document.getElementById('boardImg');
const modalScroll = document.getElementById('modalScroll');
document.getElementById('seeBoard').addEventListener('click', () => {
  boardImg.classList.remove('zoomed');
  boardImg.src = boardSrc();
  document.getElementById('modalTitle').textContent =
    (state.brand === 'HND' ? 'Honda' : 'Acura') + ' · ' + sizeOf().label + ' · storyboard';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
});
function closeModal() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
document.getElementById('modalClose').addEventListener('click', closeModal);
modalScroll.addEventListener('click', e => { if (e.target === modalScroll) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
boardImg.addEventListener('click', () => boardImg.classList.toggle('zoomed'));

renderDealers();
renderPickers();
loadAd();
</script>
</body>
</html>
