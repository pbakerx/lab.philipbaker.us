<style>
  /* The page carries the unit's ground and the root its SIZE in static CSS:
     the browser can paint the document while the runtime scripts are still
     downloading (parser-blocking, end of body), and without these a black
     unit opened as a white page for that whole window on a cold cache.
     The JS sizing in ad-player.js stays as a harmless no-op. */
  html, body { margin: 0; padding: 0; background: #000000; }
  /* No border on the ad root: with box-sizing:border-box a 1px rule turns a
     728x90 slot into a 726x88 canvas, shifts every element 1px in, and draws a
     hairline over art meant to bleed off the edge. The Review Deck outlines the
     ad on its own frame instead. */
  #ad {
    position: relative; overflow: hidden; background: #000000;
    width: 300px; height: 250px;
  }
  #ad, #ad * { box-sizing: border-box; }
  #ad img { user-select: none; -webkit-user-select: none; }
  @font-face {
    font-family: 'FuturaXBlk';
    src: url('fonts/FuturaNowForAcura-CondXBlk.ttf') format('truetype');
    font-display: block;
  }
  @font-face {
    font-family: 'AcuraBespoke';
    font-weight: 700;
    src: url('fonts/AcuraBespoke-Bold.otf') format('opentype');
    font-display: block;
  }
</style>
