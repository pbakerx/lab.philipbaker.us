     downloading (parser-blocking, end of body), and without these a black

     The JS sizing in ad-player.js stays as a harmless no-op. */
  html, body { margin: 0; padding: 0; background: #ffffff; }
  /* No border on the ad root: with box-sizing:border-box a 1px rule turns a
     728x90 slot into a 726x88 canvas, shifts every element 1px in, and draws a
     hairline over art meant to bleed off the edge. The Review Deck outlines the
     ad on its own frame instead. */
  #ad {
    position: relative; overflow: hidden; background: #ffffff;
    width: 300px; height: 250px;

  #ad img { user-select: none; -webkit-user-select: none; }
